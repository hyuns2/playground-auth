spring:
  config:
    activate:
      on-profile: secret

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT-ID}
            client-secret: ${GOOGLE_CLIENT-SECRET}
            redirect-uri: ${GOOGLE_REDIRECT-URI}
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT-ID}
            client-secret: ${NAVER_CLIENT-SECRET}
            redirect-uri: ${NAVER_REDIRECT-URI}
            authorization-grant-type: authorization_code
            scope:
              - email
              - name
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

auth:
  jwt:
    grant-type: ${AUTH_JWT_GRANT-TYPE}
    secret-key: ${AUTH_JWT_SECRET-KEY}
    access-exp: ${AUTH_JWT_ACCESS-EXP}
    refresh-exp: ${AUTH_JWT_REFRESH-EXP}
